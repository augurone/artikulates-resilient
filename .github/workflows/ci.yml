name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Retain verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resilient-verification
          path: |
            .artifacts/lint-results.json
            .artifacts/package/install-*/internal-tests.log
            .artifacts/package/install-*/internal-tests.stderr
            .artifacts/package/install-*/public-tests.log
            .artifacts/package/install-*/public-tests.stderr
            .artifacts/package/install-*/host-tests.log
            .artifacts/package/install-*/host-tests.stderr
            .artifacts/package/install-*/verification.json
          include-hidden-files: true
          if-no-files-found: warn
