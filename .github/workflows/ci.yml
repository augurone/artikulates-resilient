name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.13.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository gate
        run: |
          npm test
          npm run fixtures:check
          npx eslint . --ignore-pattern tests/fixtures
          git diff --check

      - name: Packed consumer proof
        run: npm run consumer:check
